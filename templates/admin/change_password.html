{% extends "base.html" %}
{% block content %}
  <h1>Change password</h1>
  {% if forced %}<p>You are using a temporary password. Choose your own before continuing.</p>{% endif %}
  <p><small>Passwords must be at least {{ min_password }} characters.</small></p>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/user/password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p><label>Current password <input type="password" name="current_password" required autofocus></label></p>
    <p><label>New password <input type="password" name="new_password" minlength="{{ min_password }}" required></label></p>
    <p><label>New password again <input type="password" name="confirm_password" minlength="{{ min_password }}" required></label></p>
    <p><button type="submit">Change password</button></p>
  </form>
{% endblock %}
