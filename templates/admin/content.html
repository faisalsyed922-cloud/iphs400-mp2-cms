{% extends "base.html" %}
{% from "admin/_items.html" import row %}
{% block content %}
  <h1>Content</h1>
  <p><a href="{{ url_for('admin_home') }}">Dashboard</a> · <a href="{{ url_for('new_form') }}">New post</a></p>
  <form method="get" class="filters">
    <label>Status
      <select name="status">
        <option value="">Any</option>
        <option value="draft" {% if filters.status == 'draft' %}selected{% endif %}>Draft</option>
        <option value="published" {% if filters.status == 'published' %}selected{% endif %}>Published</option>
      </select></label>
    <label>Type
      <select name="type">
        <option value="">Any</option>
        <option value="post" {% if filters.type == 'post' %}selected{% endif %}>Post</option>
        <option value="page" {% if filters.type == 'page' %}selected{% endif %}>Page</option>
      </select></label>
    <label>Author or Assigned editor
      <select name="author">
        <option value="">Anyone</option>
        {% for a in authors %}<option value="{{ a.id }}" {% if filters.author == a.id | string %}selected{% endif %}>{{ a.display_name }}</option>{% endfor %}
      </select></label>
    <button type="submit">Filter</button>
    <a href="{{ url_for('content_list') }}?mine=1">Mine</a>
    <a href="{{ url_for('content_list') }}">Clear</a>
  </form>
  {% if not items %}<p>Nothing matches.</p>{% endif %}
  <ul class="items">{% for i in items %}{{ row(i, user, can_edit) }}{% endfor %}</ul>
{% endblock %}
