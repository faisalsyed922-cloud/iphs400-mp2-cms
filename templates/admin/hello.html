{% extends "base.html" %}
{% block content %}
  <h1>T00: hello admin</h1>
  <p>Signed in as {{ user.display_name }} ({{ user.role }}).</p>
  <p><a href="{{ url_for('list_view') }}">Posts</a> · <a href="{{ url_for('pages_list') }}">Pages</a>{% if user.role == 'admin' %} · <a href="{{ url_for('users_list') }}">Users</a>{% endif %}</p>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit">Log out</button>
  </form>
{% endblock %}
