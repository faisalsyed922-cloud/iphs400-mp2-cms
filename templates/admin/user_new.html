{% extends "base.html" %}
{% block content %}
  <h1>New user</h1>
  <p><a href="{{ url_for('users_list') }}">All users</a></p>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/users">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p><label>Email <input name="email" type="email" value="{{ form.email }}" required></label></p>
    <p><label>Display name <input name="display_name" value="{{ form.display_name }}" required></label></p>
    <p><label>Title <input name="title" value="{{ form.title }}"></label></p>
    <p><label>Term <input name="term" value="{{ form.term }}" placeholder="2026–27"></label></p>
    <p><label>Role <select name="role">{% for r in roles %}<option value="{{ r }}"{% if form.role == r %} selected{% endif %}>{{ r | capitalize }}</option>{% endfor %}</select></label></p>
    <p><label>Initial password <input name="password" type="password" autocomplete="new-password" required></label>
      <small>At least {{ min_password }} characters.</small></p>
    <p><button type="submit">Create user</button></p>
  </form>
{% endblock %}
