<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ css_path | default('style.css') }}">
</head>
<body>
  <header><a href="{{ home_path | default('index.html') }}">{{ title }}</a>{% if subtitle %} <span class="subtitle">{{ subtitle }}</span>{% endif %}
    {% if nav_links %}<nav>{% for label, href in nav_links %}{% if nav_preview %}<span>{{ label }}</span>{% else %}<a href="{{ href }}">{{ label }}</a>{% endif %}{% if not loop.last %} · {% endif %}{% endfor %}</nav>{% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
