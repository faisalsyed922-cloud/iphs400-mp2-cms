{% extends "base.html" %}
{% block content %}
  <h1>{{ title }}{% if subtitle %} <small>{{ subtitle }}</small>{% endif %}</h1>
  {% if items %}
    {% for item in items %}
    <article data-post-id="{{ item.id }}">
      <h2><a href="{{ item.href }}">{{ item.title }}</a></h2>
      <p><small>{{ item.date }}</small></p>
      {{ item.excerpt | safe }}
    </article>
    {% endfor %}
    <p><a href="{{ news_path | default('news.html') }}">All news</a></p>
  {% else %}
    <p>Nothing published yet.</p>
  {% endif %}
{% endblock %}
